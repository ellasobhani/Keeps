<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-system);color:var(--text-primary);font-size:11px;display:flex;gap:20px;align-items:flex-end}.box{background:var(--surface-card);border:1px solid var(--border-hairline)}.lbl{margin-top:6px;text-align:center}</style>
<div><div class="box" style="width:90px;height:90px;border-radius:var(--radius-none)"></div><div class="lbl">none — media tiles</div></div>
<div><div class="box" style="width:90px;height:44px;border-radius:var(--radius-xs)"></div><div class="lbl">xs 4px — inputs/buttons</div></div>
<div><div class="box" style="width:90px;height:44px;border-radius:var(--radius-md)"></div><div class="lbl">md 12px — sign-in card</div></div>
<div><div style="width:44px;height:44px;border-radius:var(--radius-pill);background:var(--text-primary)"></div><div class="lbl">pill — avatars/badges</div></div>
