<style>body{margin:0;font-family:var(--font-system)}.row{display:flex;height:150px}.sw{flex:1;display:flex;align-items:flex-end;padding:10px;font-size:11px}.sw span{background:rgba(255,255,255,.75);padding:2px 6px;border-radius:3px;color:var(--text-primary)}</style>
<div class="row">
<div class="sw" style="background:var(--accent)"><span>accent #2F5233</span></div>
<div class="sw" style="background:var(--accent-muted)"><span>accent-muted #DDE7DC</span></div>
<div class="sw" style="background:var(--danger)"><span style="color:#fff;background:rgba(0,0,0,.25)">danger #B3261E</span></div>
</div>
