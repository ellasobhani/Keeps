<!-- @dsCard group="Colors" viewport="700x150" name="Neutral Palette" subtitle="Background, surface, border, ink" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-system)}.row{display:flex;height:150px}.sw{flex:1;display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-primary)}.sw span{background:rgba(255,255,255,.7);padding:2px 6px;border-radius:3px}</style>
<div class="row">
<div class="sw" style="background:var(--color-white);border-right:1px solid var(--border-hairline)"><span>white #FFFFFF</span></div>
<div class="sw" style="background:var(--color-surface)"><span>surface #F5F4F1</span></div>
<div class="sw" style="background:var(--color-border)"><span>border #E4E1DA</span></div>
<div class="sw" style="background:var(--color-ink-soft)"><span style="color:#fff;background:rgba(0,0,0,.3)">ink-soft #6B6B68</span></div>
<div class="sw" style="background:var(--color-ink)"><span style="color:#fff;background:rgba(255,255,255,.15)">ink #1A1A1A</span></div>
</div>
